name: Sell Monitor Test

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24

      # ⚡ Playwright 브라우저 캐시 설정
      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # ⚡ 요청하신 npm install 구문 구동
      - name: Install dependencies
        run: npm install

      # ⚡ 캐시 미스(Cache Miss) 발생 시에만 설치 진행
      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run monitor script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/monitor.js

      - name: Commit & Push updated seen_posts.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_posts.json
          git commit -m "chore: update seen_posts.json [skip ci]" || exit 0
          git pull --rebase origin main
          git push
