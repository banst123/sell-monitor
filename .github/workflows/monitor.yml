name: Sell Monitor Test

on:
  workflow_dispatch:  # 외부에서 API로 호출할 때 쓰는 트리거

concurrency:
  group: sell-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore seen posts cache
        id: cache-seen-restore
        uses: actions/cache/restore@v4
        with:
          path: seen_posts.json
          key: sell-monitor-seen-v1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run monitor script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/monitor.js

      - name: Save seen posts cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_posts.json
          key: sell-monitor-seen-v1
