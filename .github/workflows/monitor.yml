name: Sell Monitor Test

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # [필수 수정] 캐시 키를 동적으로 생성하여 매번 누적 저장되도록 변경
      - name: Cache seen posts
        uses: actions/cache@v4
        with:
          path: seen_posts.json
          # 실행할 때마다 고유한 ID를 붙여서 항상 새로운 캐시 파일로 저장되게 만듭니다.
          key: sell-monitor-seen-${{ github.run_id }}-${{ github.run_attempt }}
          # 불러올 때는 가장 최근에 'sell-monitor-seen-'으로 시작하는 최신 캐시를 찾아옵니다.
          restore-keys: |
            sell-monitor-seen-

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run monitor script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/monitor.js
