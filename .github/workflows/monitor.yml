name: Sell Monitor Test

on:
  # 외부 트리거 또는 GitHub 웹에서 수동 실행
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      # @v4 뒤에 최신 마이너 버전을 명시하여 Node 24 완벽 호환 보장
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run monitor script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/monitor.js

      # 🔥 [핵심] cache 대신 변경된 seen_posts.json을 레포지토리에 직접 커밋 및 푸시
      - name: Commit & Push updated seen_posts.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_posts.json
          git commit -m "chore: update seen_posts.json [skip ci]" || exit 0
          git push
