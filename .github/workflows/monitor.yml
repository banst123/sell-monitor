name: Sell Monitor Test

on:
  # 15분마다 정기 자동 실행 (원하시는 주기로 수정 가능)
  schedule:
    - cron: '*/15 * * * *'
  # 외부 트리거 또는 GitHub 웹에서 수동 실행
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          # 커밋 권한을 보장하기 위해 기본 토큰 활용
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run monitor script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/monitor.js

      # 🔥 핵심 보완: 업데이트된 seen_posts.json을 리포지토리에 영구 저장
      - name: Commit & Push updated seen_posts.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_posts.json
          git commit -m "chore: update seen_posts.json [skip ci]" || exit 0
          git push
