name: Sell Monitor Test

on:
  # 외부 크론(5분 주기) 또는 GitHub 웹에서 수동 실행
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 키워드 전용 독립 캐시 가동 (1 hour 전체 알림 캐시와 분리)
      - name: Cache seen posts
        uses: actions/cache@v4
        with:
          path: seen_posts.json
          key: keyword-seen-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            keyword-seen-

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run monitor script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/monitor.js
