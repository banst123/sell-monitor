name: Sell Monitor All (No Filter)

on:
  # 외부 크론(1시간 주기) 또는 GitHub 웹에서 수동 실행
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor_all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Cache seen posts
        uses: actions/cache@v4.2.0
        with:
          path: seen_posts.json
          key: all-seen-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            all-seen-

      - name: Remove filter config for full monitoring
        run: rm -f filter_config.json

      - name: Use Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run monitor script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/monitor.js
# 👇 코드 내부의 autoCleanCaches()가 인지할 수 있게 시스템 변수를 주입합니다.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
