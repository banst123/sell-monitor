name: Sell Monitor All (No Filter)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor_all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove filter config for full monitoring
        run: rm -f filter_config.json

      - name: Use Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run monitor script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 💡 전체 모니터링 전용 기록 파일명 지정
          SEEN_FILE_NAME: 'seen_posts_all.json'
        run: node scripts/monitor.js

      # 🔥 seen_posts_all.json 파일만 독립적으로 커밋 & 푸시
      - name: Commit & Push updated seen_posts_all.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_posts_all.json
          git commit -m "chore: update seen_posts_all.json [skip ci]" || exit 0
          git push
