name: External Trigger B-Hunt Scanner

on:
  repository_dispatch:
    types: [run-scanner]
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ⚡ 1. npm 패키지(node_modules) 캐시 설정
      - name: Cache Node Modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 🎯 캐시 미스 시에만 npm install 수행
      - name: Install Dependencies
        run: npm ci || npm install

      # ⚡ 2. Playwright 브라우저 바이너리 캐시 설정
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      # 🎯 브라우저 캐시가 없을 때만 브라우저 및 OS 필수 라이브러리 일괄 설치
      - name: Install Playwright Browsers & OS Deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # 🎯 브라우저가 캐싱되어 있다면 OS 라이브러리만 경량 확인 (1~2초 소요)
      - name: Install Playwright System Dependencies Only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Main Scanner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/index.cjs

      - name: Commit and push updated DB files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: auto update B-Hunt DB files [skip ci]" || exit 0
          git pull --rebase origin main
          git push
