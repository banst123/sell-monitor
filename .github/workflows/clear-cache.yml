name: Clear All Caches

on:
  workflow_dispatch: # 직접 수동으로 실행 버튼을 누를 때만 작동합니다.

permissions:
  actions: write # 캐시를 삭제할 수 있는 권한 부여

jobs:
  clear-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Clear Caches
        uses: actions/github-script@v7
        with:
          script: |
            let pageIndex = 1;
            let totalDeletedCount = 0;
            const startTime = Date.now();
            
            console.log("====================================================");
            console.log("[START] GitHub Actions 캐시 완전 전멸 프로세스 가동");
            console.log("====================================================");
            
            while (true) {
              console.log(`\n[단계 1] ${pageIndex}번째 캐시 묶음(최대 100건) 데이터 요청 중...`);
              
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              
              const cacheList = caches.data.actions_caches;
              const totalCountOnServer = caches.data.total_count;
              
              if (!cacheList || cacheList.length === 0) {
                console.log("[결과] 서버에 등록된 저장된 캐시가 더 이상 없습니다.");
                break;
              }
              
              console.log(`   └ [성공] 현재 남은 전체 캐시: 총 ${totalCountOnServer}개`);
              console.log(`   └ [성공] 이번 회차에서 삭제할 타겟 개수: ${cacheList.length}개`);
              console.log(`\n[단계 2] ${pageIndex}번째 묶음 순차 삭제 시작`);
              console.log("----------------------------------------------------");
              
              let currentBatchIndex = 1;
              for (const cache of cacheList) {
                const itemStartTime = Date.now();
                
                // 개별 캐시 삭제 로그 출력
                console.log(`⏳ [${currentBatchIndex}/${cacheList.length}] ID: ${cache.id} | 키: ${cache.key} 삭제 중...`);
                
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                });
                
                const itemDuration = Date.now() - itemStartTime;
                // console.log(`   ➔ 완료 (${itemDuration}ms)`); // 속도를 위해 필요시 주석 해제
                
                currentBatchIndex++;
                totalDeletedCount++;
              }
              
              console.log("----------------------------------------------------");
              console.log(`[OK] ${pageIndex}번째 묶음 (${cacheList.length}건) 삭제 완료.`);
              
              // 다음 루프를 위한 준비 및 API 안정성을 위한 1초 대기
              pageIndex++;
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            
            const totalDuration = ((Date.now() - startTime) / 1000).toFixed(1);
            console.log("\n====================================================");
            console.log(`✨ [FINISH] 캐시 완벽 청소 완료!`);
            console.log(`   · 처리한 페이지 횟수: ${pageIndex - 1}회`);
            console.log(`   · 총 삭제된 캐시 개수: ${totalDeletedCount}개`);
            console.log(`   · 총 소요 시간: ${totalDuration}초`);
            console.log("====================================================");
